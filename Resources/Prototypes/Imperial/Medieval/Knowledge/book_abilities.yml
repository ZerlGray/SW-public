  - type: Action
    autoPopulate: false
    raiseOnUser: true
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_text
  - type: InstantAction
    event: !type:BookDiceCheatActionEvent

- type: entity
  id: ActionBookExtractReagent
  name: Разделение составов
  description: Выделить одно вещество из смеси. Держите смесь и пустую открытую ёмкость в руках.
