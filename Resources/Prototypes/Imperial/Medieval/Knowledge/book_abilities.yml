  id: ActionBookPorter
  name: Укладка дорожного груза
  description: Выберите переносной ящик, чтобы превратить его в тяжёлую поклажу. Разверните её кликом.
  components:
  - type: EntityTargetAction
    event: !type:BookPorterActionEvent

- type: entity
  parent: BaseActionBookTargetAbility
  id: ActionBookPackWorkbench
  name: Мастерская в дороге
  description: Выберите станок, чтобы упаковать его для перевозки. Разверните поклажу кликом.
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - BookPackableWorkbench
    event: !type:BookPackWorkbenchActionEvent

- type: entity
  parent: BaseActionBookTargetAbility
  id: ActionBookTrapDisarm
  name: Механизмы древних руин
