- type: entity
  id: ActionBookAbilitiesMenu
  name: Способности
  description: Открыть изученные способности и знания.
  components:
  - type: Action
    raiseOnUser: true
    clientExclusive: true
    checkCanInteract: false
    checkConsciousness: true
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_text
  - type: InstantAction
    event: !type:BookOpenAbilitiesMenuEvent

- type: entity
  id: ActionBookDiceCheat
  name: Нечестная кость
  description: Незаметно подготовить результат следующего броска кости в руке.
