    autoPopulate: false
    raiseOnUser: true
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_text
  - type: TargetAction
    range: 2
    repeat: false
    checkCanAccess: true
  - type: EntityTargetAction
    canTargetSelf: false

- type: entity
