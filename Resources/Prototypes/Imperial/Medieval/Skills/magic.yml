- type: entity
  id: ActionSkillLearnMagic
  name: изучение заклинаний
  description: Личное обучение. Одно базовое заклинание бесплатно, остальные стоят на 100 эссенции дороже гримуара.
  components:
  - type: Action
    icon: { sprite: Imperial/Medieval/Misc/magic_book.rsi, state: icon }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:SkillLearnMagicActionEvent

- type: entity
  id: SkillPersonalSpellStore
  name: личное обучение магии
  categories: [ HideSpawnMenu ]
  components:
  - type: SkillLearningStore
  - type: UserInterface
    interfaces:
      enum.ImperialStoreUiKey.Key:
        type: ImperialStoreBoundUserInterface
  - type: ImperialStore
    name: medieval-store-name
    withdrawText: medieval-store-withdraw-button-text
    currencyTitle: medieval-store-currency-title-text
    ownerOnly: true
    bonusCount: 5
    categories:
    - MedievalFireSpells
    - MedievalLightSpells
    - MedievalVodkaSpells
    - MedievalEarthSpells
    - MedievalDarknessSpells
    currencyWhitelist:
    - MagicMedievalFire
    - MagicMedievalLight
    - MagicMedievalVodka
    - MagicMedievalEarth
    - MagicMedievalDarkness
    - ArchmagePoints

- type: imperialListing
  id: SkillArchmagicFire
  name: skills-buy-archmagic
  description: skills-buy-archmagic-desc
  icon: { sprite: Imperial/Medieval/Misc/magic_book.rsi, state: icon }
  cost:
    MagicMedievalFire: 500
  categories:
  - MedievalFireSpells
  conditions:
  - !type:SkillArchmagicCondition

