- type: entity
  id: ActionSkillPacify
  name: Призыв к перемирию
  description: На пять секунд накладывает обычный пацифизм на вас и окружающих в пределах слышимости. Перезарядка — три минуты.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: Imperial/Medieval/Surrender/action.rsi
      state: action
  - type: InstantAction
    event: !type:SkillPacifyActionEvent

- type: entity
  id: ActionSkillRecovery
  name: Второе дыхание
  description: Восстанавливает всю стамину, снимает оглушение, сбитие и обычный захват. На три секунды защищает от их повторного наложения. Перезарядка — три минуты.
  components:
  - type: Action
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: Imperial/Medieval/Interface/Skills/endurance.rsi
      state: best
  - type: InstantAction
    event: !type:SkillRecoveryActionEvent
